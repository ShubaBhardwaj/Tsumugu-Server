services:
  tsumugu-backend:
    build: .
    container_name: tsumugu-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      INNGEST_DEV: "false"
    expose:
      - "8080"
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

networks:
  proxy-network:
    external: true
